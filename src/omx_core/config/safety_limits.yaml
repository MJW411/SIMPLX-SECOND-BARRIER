# 무인 시험 안전 한도. 실행기(omx/robot/executor.py)가 강제한다.
# 값을 올리기 전에 반드시 사람이 옆에서 지켜볼 것.

# 속도·가속도: "최대"는 URDF 관절 속도 4.8 rad/s, 가속 8 rad/s^2 기준.
# 사용자가 제어판 슬라이더로 올려도 아래 상한(최대의 20%)을 넘지 못한다.
joint_vel_max: 4.8          # rad/s (참조용 최대값)
joint_acc_max: 8.0          # rad/s^2 (참조용 최대값)
speed_cap_ratio: 0.20       # 상한: 최대의 20%
speed_default_ratio: 0.10   # 시작 속도: 최대의 10%
cart_speed_max: 0.05        # m/s, TCP 조그·직선 이동 상한
cart_speed_default: 0.025   # m/s

# PWM(출력) 제한: 모터 PWM 한계(885)에 대한 비율. 위치 모드에서 Goal PWM으로 적용.
arm_pwm_ratio: 0.60
# 중력을 버티는 관절은 더 높게: 60%로는 팔을 앞으로 뻗은 자세에서 어깨(ID12)가 출력 한계에 붙어
# 모터 자체 과부하 보호로 꺼졌다 (2026-09-27 01:56 실기). 공식 설정은 100%.
# 2026-10-12: 손목(joint4)도 물건을 들고 손목을 꺾은 자세에서 처져 60% → 80% (사용자 결정).
arm_pwm_ratio_joints: {joint2: 0.95, joint3: 0.90, joint4: 0.80}
# 그리퍼 전류 제한 (mA, XL330 전류기반 위치 모드의 Goal Current). 공식값 600.
gripper_current_ma: 250
# 그리퍼 힘 상한 (mA). 제어판의 "힘 100%" = 이 값. 저장된 그리퍼 동작의 힘 %는 이 값을 기준으로 한다.
gripper_current_cap_ma: 500

# 관절 한계 안쪽 여유 (rad). 아래 joint_limits 에서 이만큼 더 안쪽만 허용.
joint_margin: 0.10
# 관절 한계 (rad). joint3은 모터 EEPROM 한계(1024~3140) 기준.
# joint2 하한: EEPROM은 -1.87 이지만 실측 기구 멈춤점이 약 -1.555 rad (2026-09-27 02:10, 목표 -1.6/-1.7 → 실제 -1.546/-1.565).
# 멈춤점 너머를 명령하면 모터가 계속 밀어 약 15초 만에 모터 자체 과부하 차단(ID12)된다 → -1.63 (여유 포함 실효 -1.53).
joint_limits:
  joint1: [-2.60, 2.60]
  joint2: [-1.63, 1.66]
  joint3: [-1.57, 1.68]
  joint4: [-1.80, 1.68]   # 상한: 실측 기구 멈춤점 약 1.60 rad (02:17, 목표 1.805 → 실제 1.597) → 실효 1.58
  joint5: [-2.60, 2.60]
gripper_limits: [0.0, 1.05]   # rad, 0=닫힘

# 작업 상자 (로봇 베이스 기준, m). TCP 목표가 이 밖이면 거부.
workspace_box:
  x: [-0.05, 0.38]
  y: [-0.30, 0.30]
  z: [0.005, 0.40]
# 팔 링크 점들의 최소 높이 (m). 팔꿈치·손목이 바닥(작업대)을 치지 않게.
min_link_z: 0.008

# 모니터링
temp_warn_c: 55             # 이 온도 이상이면 이벤트 로그에 경고 (식으면 다시 경고 가능)
temp_stop_c: 60             # 이 온도 이상이면 정지(자리 유지)하고 식을 때까지 대기
temp_resume_c: 52           # 이 온도 이하로 식으면 재가동 가능
track_error_rad: 0.20       # 목표-현재 위치 오차가 이보다 크면...
track_error_time: 0.40      # ...이 시간 이상 지속 시 정지 (충돌·과부하 의심)
comm_fail_max: 5            # 연속 통신 실패 횟수 → 정지
load_stop_ratio: 0.85       # 부하가 그 관절 PWM 한도의 이 비율 이상으로 0.5초 지속되면 정지 (모터 자체 과부하 차단 전에)
permit_timeout: 0.30
# 막힘 양보: 정지(자리 유지) 중 관절이 목표에 이만큼 못 미친 채 이 시간이 지나면 목표를 현재 위치로 바꿔 더 밀지 않는다
# (기구 멈춤점·장애물에 계속 밀다가 모터 과부하 차단되는 것 방지. 그리퍼는 제외 — 물체를 쥐어야 하므로)
stall_yield_rad: 0.05
stall_yield_time: 0.8        # 안전 관리자의 "움직여도 됨" 허가가 이 시간 끊기면 정지

# 반복 동작 시간 제한 (분, 0 = 끔). 무인 시험용 한도였다 — 시연은 반복 횟수로 끝낸다 (2026-10-08 사용자: 4분 한도 없앰)
cycle_max_minutes: 0
